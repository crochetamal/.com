<!doctype html>
<html lang="ar" dir="rtl">
<head>

  <nav aria-label="التنقل الرئيسي">

<main id="top">
  <section class="hero">

      <p id="hText"></p>

<footer class="foot">
  <div class="social" id="social"></div>
  <p><bdi dir="ltr">Crochet.Amal</bdi> · <span>© 2026</span> · فعل يدوي بحب</p>
