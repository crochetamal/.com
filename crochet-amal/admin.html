<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | Crochet.Amal</title>
<link rel="icon" href="assets/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
<main class="gate">
  <img src="assets/images/favicon.png" alt="" width="72" height="72" style="margin:auto;border-radius:50%">
  <h1 style="font-size:1.6rem"><bdi dir="ltr" class="wordmark">Crochet.Amal</bdi> · لوحة التحكم</h1>
  <button class="btn" id="admBtn" type="button">تسجيل الدخول</button>
  <p><a href="./">العودة إلى المتجر</a></p>
</main>
<dialog id="loginDlg" class="dlg">
  <form method="dialog" id="loginForm">
    <h2>دخول المسؤولة</h2>
    <div id="emW" hidden><label for="em">البريد الإلكتروني</label><input type="email" id="em" dir="ltr" autocomplete="username"></div>
    <label for="pw">كلمة المرور</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <div class="row"><button type="button" class="btn ghost" data-close>إلغاء</button><button class="btn" id="loginGo">دخول</button></div>
  </form>
</dialog>

<div id="admin" class="admin" hidden>
  <div class="adm-bar">
    <strong>لوحة التحكم</strong>
    <span class="adm-actions">
      <button class="btn sm ghost" id="aPrev">معاينة</button>
      <button class="btn sm" id="aPub">نشر الآن</button>
      <button class="btn sm ghost" id="aExp">تصدير JSON</button>
      <label class="btn sm ghost" for="aImp">استيراد JSON</label><input type="file" id="aImp" accept="application/json" hidden>
      <button class="btn sm ghost" id="aReset">استرجاع الأصل</button>
      <button class="btn sm ghost" id="aOut">خروج</button>
    </span>
  </div>
  <p class="notice" id="notice">التغييرات تُحفظ تلقائيًا في هذا المتصفح فقط. للنشر لكل الزوار فعّلي Firebase أو صدّري JSON واستبدلي <bdi dir="ltr">data/products.json</bdi> (انظري README).</p>
  <div class="adm-body">
    <div><button class="btn sm" id="aAdd">+ منتج جديد</button><ul class="alist" id="aList"></ul></div>
    <form class="aform" id="aForm" hidden novalidate>
      <h3 id="fTitle"></h3>
      <label for="fName">اسم المنتج</label><input id="fName" maxlength="80" required>
      <label for="fDesc">الوصف</label><textarea id="fDesc" rows="3" maxlength="300" required></textarea>
      <label for="fPrice">الثمن (درهم)</label><input id="fPrice" type="number" min="1" step="1" required>
      <label for="fCat">القسم</label><select id="fCat"></select>
      <label for="fImg">رابط الصورة</label><input id="fImg" dir="ltr" placeholder="https://... أو assets/images/name.jpg" required>
      <label for="fFile">أو ارفعي صورة من هاتفك</label><input type="file" id="fFile" accept="image/*">
      <img id="fPrev" class="fprev" alt="معاينة الصورة" width="120" height="120">
      <label class="chk"><input type="checkbox" id="fVis"> ظاهر في المتجر</label>
      <p class="err" id="fErr" role="alert"></p>
      <div class="row"><button type="button" class="btn ghost" id="fCancel">إلغاء</button><button class="btn" id="fSave">حفظ المنتج</button></div>
    </form>
  </div>
  <div id="aPreview" class="preview" hidden><h3>معاينة المتجر (لم تُنشر بعد)</h3><div class="grid" id="pGrid"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
